[workspace]
resolver = "2"
members = [
    "crates/quota-core",
    "crates/quota-adapters",
    "crates/quota-source-claude-statusline",
    "crates/quota-source-cursor",
    "crates/quota-secrets",
    "crates/quotad",
    "crates/quota",
    "crates/quota-ctl",
    "crates/quota-bench",
]
# Targeted (lean) builds. Source crates sit behind the `Provider` trait:
#   quota-source-claude-statusline  parser for Claude Code's statusline JSON (used by `quota`)
#   quota-source-cursor             Cursor usage-summary collector (used by `quotad`)
# quotad links quota-secrets read-only (Claude Code's Keychain item, the Cursor
# cookie); it never links quota-ctl. Drop the control plane when unwanted:
#   cargo build --release -p quotad -p quota
# quota-ctl enables the OpenBao feature; quotad has its own opt-in `openbao` feature.
# quota-bench is a local harness, not installed. See install.sh --minimal.

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.83"
description = "Rust-native inference quota daemon and CLI (quotad, quota, quota-ctl)"
repository = "https://github.com/op0ai/infer-quota"

[workspace.dependencies]
quota-core = { path = "crates/quota-core", version = "0.1.0" }
quota-adapters = { path = "crates/quota-adapters", version = "0.1.0" }
quota-secrets = { path = "crates/quota-secrets", version = "0.1.0" }
quota-source-claude-statusline = { path = "crates/quota-source-claude-statusline", version = "0.1.0" }
quota-source-cursor = { path = "crates/quota-source-cursor", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.43", default-features = false, features = [
    "io-util",
    "macros",
    "net",
    "rt",
    "signal",
    "sync",
    "time",
] }
clap = { version = "=4.5.23", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
] }
rustls = { version = "=0.21.12", default-features = false, features = ["tls12"] }
webpki-roots = "=0.25.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"
opt-level = "s"

# Optional size pass. Default `release` stays thin-LTO + debuginfo strip so
# stack traces in the field still have symbol names. Measure before switching.
[profile.dist]
inherits = "release"
lto = "fat"
strip = "symbols"
