<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-label="Redacted first-run quota status. No tokens.">
  <title>quota status (redacted)</title>
  <defs>
    <style>
      .chrome { font: 600 12px ui-sans-serif, system-ui, sans-serif; fill: #8a8074; }
      .prompt { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #e4d3bc; }
      .cmd { font: 500 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #f4eee4; }
      .out { font: 500 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #c9c0b4; }
      .dim { fill: #8a8074; }
      .ok { fill: #9bb59a; }
      .warn { fill: #d4b37a; }
    </style>
  </defs>
  <rect width="760" height="400" rx="12" fill="#12110f"/>
  <rect x="1" y="1" width="758" height="398" rx="11" fill="none" stroke="#2a2722"/>
  <circle cx="22" cy="20" r="5" fill="#3a3530"/>
  <circle cx="40" cy="20" r="5" fill="#3a3530"/>
  <circle cx="58" cy="20" r="5" fill="#3a3530"/>
  <text x="380" y="24" text-anchor="middle" class="chrome">quota status / first run / no tokens</text>

  <text x="24" y="56" class="prompt">$</text>
  <text x="40" y="56" class="cmd">./install.sh --minimal</text>
  <text x="24" y="78" class="out dim">installed ~/.local/bin/quotad</text>
  <text x="24" y="96" class="out dim">installed ~/.local/bin/quota</text>

  <text x="24" y="126" class="prompt">$</text>
  <text x="40" y="126" class="cmd">export PATH="$HOME/.local/bin:$PATH"</text>
  <text x="24" y="148" class="prompt">$</text>
  <text x="40" y="148" class="cmd">quotad run &amp;</text>
  <text x="24" y="166" class="prompt">$</text>
  <text x="40" y="166" class="cmd">quota status</text>

  <text x="24" y="198" class="out dim">fetched 2026-09-27T14:12:00Z</text>
  <text x="24" y="220"><tspan class="out">codex   </tspan><tspan class="warn">unavailable</tspan><tspan class="out dim">  src=oauth</tspan></text>
  <text x="24" y="238" class="out dim">         no_credentials: credential file not found: ~/.codex/auth.json</text>
  <text x="24" y="256" class="out dim">         consulted ~/.codex/auth.json</text>
  <text x="24" y="280"><tspan class="out">claude  </tspan><tspan class="warn">unavailable</tspan><tspan class="out dim">  src=oauth</tspan></text>
  <text x="24" y="298" class="out dim">         no_credentials: credential file not found: ~/.claude/.credentials.json</text>
  <text x="24" y="316" class="out dim">         consulted ~/.claude/.credentials.json</text>

  <text x="24" y="350" class="out ok">unavailable + a reason is a real answer. Do not invent remaining tokens.</text>
  <text x="24" y="372" class="out dim">quotad reuses existing CLI sessions. quota never reads those files.</text>
</svg>
