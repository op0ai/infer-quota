# Local OpenBao only. Not a production vault.
# Token is a dummy so agents can start the stack without inventing a password.
services:
  openbao:
    image: openbao/openbao:2.3.1
    container_name: quota-openbao-dev
    environment:
      BAO_DEV_ROOT_TOKEN_ID: dev-only-not-for-prod
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: ["server", "-dev"]
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
