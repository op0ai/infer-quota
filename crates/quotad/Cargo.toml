[package]
name = "quotad"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Foreground inference-quota daemon (Unix domain socket)"
readme = false

[dependencies]
clap.workspace = true
quota-adapters.workspace = true
quota-core.workspace = true
# Safe `umask` so the socket inode is created 0600, not chmod-after-bind.
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs", "process"] }
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
