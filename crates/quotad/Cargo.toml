[package]
name = "quotad"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Foreground inference-quota daemon (Unix domain socket)"
readme = false

[features]
default = []
# OpenBao in the Cursor-credential lookup, after the OS keychain (rustls, already in the tree via quota-adapters).
openbao = ["quota-source-cursor/openbao"]

[dependencies]
clap.workspace = true
quota-adapters.workspace = true
quota-core.workspace = true
quota-source-cursor.workspace = true
# Safe `umask` so the socket inode is created 0600, not chmod-after-bind.
# `net` is Linux `SO_PEERCRED` only (same crate, no new dependency).
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs", "process", "net"] }
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
quota-core.workspace = true
# The daemon test feeds a real parsed statusline push through `observe`.
quota-source-claude-statusline.workspace = true
serde_json.workspace = true
# Already present in Cargo.lock; TempDir isolates simultaneous hotpath processes.
tempfile = "3.27.0"
