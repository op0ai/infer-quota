name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: test (offline)
        run: cargo test --locked --workspace
      - name: release build
        run: cargo build --locked --workspace --release
      - name: fixture redaction
        run: |
          if grep -R -n -E --include='*.json' --include='*.jsonl' --include='*.md' \
            'eyJ[A-Za-z0-9_-]{8,}' fixtures docs; then
            echo "possible JWT-like material in fixtures/docs" >&2
            exit 1
          fi
          if grep -R -l -E --include='*.json' --include='*.jsonl' \
            '"access_token"|"refresh_token"|"WorkosCursorSessionToken"' fixtures \
            | grep -v redacted; then
            echo "unredacted credential field names outside *.redacted.*" >&2
            exit 1
          fi
      - name: cargo audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
