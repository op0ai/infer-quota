name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: test workspace (macOS)
        run: cargo test --locked --workspace

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: install.sh syntax
        run: sh -n install.sh
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: test (offline)
        run: cargo test --locked --workspace
      - name: test secrets without OpenBao (feature gate)
        run: cargo test --locked -p quota-secrets
      - name: test OpenBao feature (offline mocks)
        run: cargo test --locked -p quota-secrets --features openbao
      - name: release build
        run: cargo build --locked --workspace --release
      - name: fixture redaction
        run: python3 scripts/check_fixtures.py

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          # rustls 0.21 / rustls-webpki 0.101.7 (MSRV 1.83). Patches live only
          # in webpki 0.103+ / rustls 0.23, which pull url+icu. See docs/SECURITY.md.
          cargo audit \
            --ignore RUSTSEC-2026-0098 \
            --ignore RUSTSEC-2026-0104 \
            --ignore RUSTSEC-2026-0099

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: install
        run: bun install --frozen-lockfile
      - name: format
        run: bun run fmt:check
      - name: lint
        run: bun run lint
      - name: check
        run: bun run check
      - name: build
        run: bun run build
      - name: validate links
        run: bunx blume validate
      - name: agent artifacts
        run: |
          test -f dist/llms.txt
          test -f dist/llms-full.txt
          test -f dist/agent-readability.json
          test -f dist/api/docs/pages.json
          test -f dist/openapi.json
          test -f dist/quotad.md
