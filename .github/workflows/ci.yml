name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: test (offline)
        run: cargo test --locked --workspace
      - name: release build
        run: cargo build --locked --workspace --release

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: install
        run: bun install --frozen-lockfile
      - name: format
        run: bun run fmt:check
      - name: lint
        run: bun run lint
      - name: check
        run: bun run check
      - name: build
        run: bun run build
      - name: validate links
        run: bunx blume validate
      - name: agent artifacts
        run: |
          test -f dist/llms.txt
          test -f dist/llms-full.txt
          test -f dist/agent-readability.json
          test -f dist/api/docs/pages.json
          test -f dist/openapi.json
          test -f dist/quotad.md
